# CodeQL configuration for Nestor.
#
# Scope CodeQL analysis to first-party source. The C/C++ analysis builds into
# `build/debug` and vendored dependencies are fetched under `build/**/_deps/`
# (nats.c, …) and `build/debug` (Conan). Those trees are third-party code we do
# not maintain, so their findings — including alerts that surface as "critical"
# (cpp/use-after-free) but actually point at upstream nats.c — must not be
# reported against this repo.
#
# See HomericIntelligence/Nestor#131.
name: "Nestor CodeQL config"

paths-ignore:
  - build/**
  - "**/_deps/**"
  - test/src/test_sanitizers.cpp  # deliberate ASAN/TSAN proof file — CodeQL analysis of it is noise
