name: Merge Queue Smoke

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mq-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-queue-smoke:
    name: merge-queue-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      # All four smoke checks run inside the CI container (image layer is
      # cached via the podman storage cache warmed by _required.yml).
      - name: Validate schemas, merge-queue policy, yamllint, version (in container)
        run: |
          podman run --rm \
            --userns=keep-id \
            -e CONAN_HOME=/tmp/conan2 \
            -v "$PWD:/workspace:Z" -w /workspace nestor-ci:local \
            bash -c '
              set -euo pipefail
              # Vendored schema, network-free: fails fast on real violations.
              find .github/workflows -name "*.yml" -print0 | \
                xargs -0 check-jsonschema --builtin-schema vendor.github-workflows
              python3 test/test_merge_queue.py
              yamllint -d relaxed .github/
              python3 -c "
                import re
                cmake = open('CMakeLists.txt').read()
                v = re.search(r'VERSION\\s+(\\S+)', cmake).group(1)
                print(f'CMake version: {v}')
              "
            '
