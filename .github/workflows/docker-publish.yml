name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build and (conditionally) push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read project version
        id: version
        run: |
          set -euo pipefail
          v=$(python3 -c "
          import re
          cmake = open('CMakeLists.txt').read()
          m = re.search(r'VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)', cmake)
          assert m, 'no semver VERSION found in CMakeLists.txt'
          print(m.group(1))
          ")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Packaging Nestor v$v"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build distributable image (single-arch, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: nestor:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image tarball artifact
        run: |
          set -euo pipefail
          out="nestor-${{ steps.version.outputs.version }}-amd64.tar"
          docker save "nestor:${{ steps.version.outputs.version }}" -o "$out"
          ls -lh "$out"
          echo "TARBALL=$out" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nestor-image-amd64
          path: ${{ env.TARBALL }}
          retention-days: 14

  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [package]
    permissions:
      contents: read
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nestor-image-amd64

      - name: Load image
        id: load
        run: |
          set -euo pipefail
          tar=$(ls nestor-*-amd64.tar)
          docker load -i "$tar"
          # Resolve the loaded image ref deterministically from the local store.
          img=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep '^nestor:' | head -1)
          if [ -z "$img" ]; then
            echo "::error::no nestor image found after docker load"
            exit 1
          fi
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "Loaded $img"

      - name: Clean-install smoke run (detached + health poll)
        env:
          IMAGE: ${{ steps.load.outputs.image }}
        run: |
          set -euo pipefail

          cleanup() {
            if [ -n "${cid:-}" ] && [ -n "$(docker ps -aq --filter "id=$cid")" ]; then
              docker rm -f "$cid" >/dev/null
            fi
          }
          trap cleanup EXIT

          # Run the packaged image with no prior state — a true clean install.
          cid=$(docker run -d \
            -e NATS_URL=nats://invalid.local:4222 \
            -e NESTOR_AUTH_TOKEN=ci-smoke-only-token \
            -e NESTOR_BIND_ADDR=0.0.0.0 \
            -p 18081:8081 \
            "$IMAGE")

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ci-smoke-only-token" http://127.0.0.1:18081/v1/health >/dev/null; then
              ok=1
              echo "health OK on attempt $i"
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "packaged image did not serve /v1/health within 30s; logs:"
            docker logs "$cid"
            exit 1
          fi
          echo "install smoke OK"

  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Release machinery is tag-driven (semver tags publish to GHCR). This job
    # is a DRY-RUN: it validates version/changelog consistency on every push
    # and PR, and on a tag verifies the tag matches the source version. It
    # NEVER publishes — publication is handled by the `build` job on tag push.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version + changelog (dry run, no publish)
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          version=$(python3 -c "
          import re
          cmake = open('CMakeLists.txt').read()
          m = re.search(r'VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)', cmake)
          assert m, 'no semver VERSION found in CMakeLists.txt'
          print(m.group(1))
          ")
          echo "Source version: $version"

          # CHANGELOG must exist and carry an Unreleased section plus a heading
          # for the current source version (or it is still under Unreleased).
          test -f CHANGELOG.md || { echo "::error::CHANGELOG.md missing"; exit 1; }
          grep -qE '^\#\# \[Unreleased\]' CHANGELOG.md || {
            echo "::error::CHANGELOG.md missing an [Unreleased] section"; exit 1; }

          # On a tag build, the tag (vX.Y.Z) must match the source version and
          # the CHANGELOG must contain a matching released section.
          if [ "$REF_TYPE" = "tag" ]; then
            tag_version="${REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::tag $REF_NAME does not match source version $version"
              exit 1
            fi
            if ! grep -qE "^\#\# \[$version\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no released section for [$version]"
              exit 1
            fi
            echo "Tag $REF_NAME validated against source version $version"
          else
            echo "Non-tag build: version/changelog structure validated (dry run)."
          fi
          echo "release dry-run OK (no artifacts published)"
