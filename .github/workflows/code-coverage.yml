name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      # Coverage build + report inside the CI container. gcovr comes from the
      # locked uv toolchain (uv.lock pins gcovr 8.6 — the LCOV_EXCL_* marker
      # placement in src/nats_client.cpp was verified against this exact
      # version; the root toolchain resolves it identically).
      - name: Coverage build + report (in container)
        run: |
          mkdir -p "$HOME/.conan2"
          podman run --rm \
            --userns=keep-id \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -w /workspace nestor-ci:local \
            bash -c '
              set -euo pipefail
              conan profile detect --exist-ok
              conan install . --build=missing -s build_type=Debug --output-folder build/coverage
              cmake --preset coverage
              cmake --build --preset coverage
              ctest --preset coverage
              ./scripts/coverage.sh
              gcovr \
                --root . \
                --filter include \
                --filter src \
                --exclude src/server_main.cpp \
                --gcov-ignore-parse-errors=negative_hits.warn \
                --print-summary \
                --fail-under-line 80 \
                build/coverage
            '

  check-all:
    name: All Coverage Checks
    runs-on: ubuntu-24.04
    needs: [coverage]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "Coverage check failed"; exit 1
          fi
          echo "All checks passed"
