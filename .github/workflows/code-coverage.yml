name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get install -y ninja-build gcovr
          pip install conan
          conan profile detect --force
      - name: Install Conan dependencies
        run: |
          conan install . --build=missing -s build_type=Debug \
            --output-folder build/coverage
      - name: Configure
        run: cmake --preset coverage
      - name: Build
        run: cmake --build --preset coverage
      - name: Test
        run: ctest --preset coverage
      - name: Generate coverage report
        run: ./scripts/coverage.sh
      - name: Check threshold
        # gcovr has a first-class --fail-under-line flag; the previous
        # grep + python pipeline broke whenever gcovr changed its summary
        # wording or when the regex tripped over locale-formatted floats.
        run: |
          set -euo pipefail
          gcovr \
            --root . \
            --filter include \
            --filter src \
            --exclude src/server_main.cpp \
            --exclude src/nats_client.cpp \
            --gcov-ignore-parse-errors=negative_hits.warn \
            --fail-under-line 80 \
            build/coverage

  check-all:
    name: All Coverage Checks
    runs-on: ubuntu-24.04
    needs: [coverage]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "Coverage check failed"; exit 1
          fi
          echo "All checks passed"
