name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc, clang]
        build_type: [debug, release]
        include:
          - os: ubuntu-24.04
            compiler: clang
            build_type: asan
          - os: ubuntu-24.04
            compiler: clang
            build_type: tsan
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      # Every matrix cell (gcc/clang x debug/release/asan/tsan) configures,
      # builds, and tests inside the CI container. The compiler is selected via
      # CC/CXX, mirroring the previous native matrix job.
      - name: Configure, build, test (in container)
        env:
          COMPILER: ${{ matrix.compiler }}
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          mkdir -p "$HOME/.conan2"
          podman run --rm \
            --userns=keep-id \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -w /workspace nestor-ci:local \
            bash -c '
              set -euo pipefail
              conan profile detect --exist-ok
              bt="$BUILD_TYPE"
              ctype=Release
              case "$bt" in debug|asan|tsan) ctype=Debug ;; esac
              conan install . --build=missing -s build_type="$ctype" --output-folder "build/$bt"
              if [ "$COMPILER" = "clang" ]; then
                export CC=clang CXX=clang++
              fi
              cmake --preset "$bt"
              cmake --build --preset "$bt"
              ctest --preset "$bt"
            '

  check-all:
    name: All Build/Test Checks
    runs-on: ubuntu-24.04
    needs: [build-test]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "build-test failed"; exit 1
          fi
          echo "All checks passed"
