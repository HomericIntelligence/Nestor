name: Required Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: "Reject silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            -- \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.hcl' \
            'Dockerfile*' '**/Dockerfile*' \
            'justfile' '**/justfile' 'Justfile' '**/Justfile')
          declare -a scan_files=()
          for f in "${files[@]}"; do
            case "$f" in
              # Exempt this workflow file (heredoc would otherwise self-match)
              .github/workflows/_required.yml) continue ;;
              # Exempt any runbook that documents the rule (if present)
              docs/runbooks/no-silent-failures.md) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nE '\|\|[[:space:]]*true([[:space:]]*$|[[:space:]]+#)' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found silent-failure workarounds above. Refactor per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no silent-failure workarounds found'

      - name: "Reject continue-on-error workflow opt-out"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow files"
            exit 0
          fi
          if grep -nE '^[[:space:]]*continue-on-error:[[:space:]]*true[[:space:]]*$' "${files[@]}"; then
            echo ""
            echo '::error::Found "continue-on-error: true" above. Fix the root cause per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no "continue-on-error: true" found'

      - name: "Reject advisory annotation pattern"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          # The advisory-annotation pattern in workflow run blocks is morally
          # equivalent to continue-on-error: true: it lets a tool fail without
          # failing the CI step. The runbook (Bucket F) requires every tool
          # to be fail-fast. The only legitimate annotation is informational
          # text not tied to a tool's exit code — those should use
          # echo "WARN:" to stdout instead. See docs/runbooks/no-silent-failures.md.
          declare -a scan_files=()
          for f in "${files[@]}"; do
            # Exempt this workflow file (heredoc would otherwise self-match).
            case "$f" in
              .github/workflows/_required.yml) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nF '::warning::' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found advisory annotations above. Make the underlying tool fail-fast or use echo "WARN:" to stdout. See docs/runbooks/no-silent-failures.md Bucket F.'
            exit 1
          fi
          echo 'OK: no advisory annotations found'

  branch-protection-drift:
    name: branch-protection-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify branch protection configuration
        run: bash scripts/verify-branch-protection.sh

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        # Ensure clang-format is present so the check below cannot silently
        # bypass enforcement when the tool is missing — see #32.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: clang-format check
        run: |
          set -euo pipefail
          mapfile -t files < <(find src include -type f \( -name "*.cpp" -o -name "*.hpp" \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ sources to format-check"
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"
      - name: yamllint
        run: pip install yamllint && yamllint -d relaxed .github/

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tidy
      - name: Conan install (Debug)
        uses: ./.github/actions/conan-install
        with:
          build-type: Debug
      - name: Configure with clang-tidy
        run: cmake --preset debug -DProjectNestor_ENABLE_CLANG_TIDY=ON
      - name: clang-tidy check
        run: |
          set -euo pipefail
          if pixi run clang-tidy 2>/dev/null; then
            echo "pixi clang-tidy passed"
          else
            mapfile -t cpp_files < <(find src -name "*.cpp" | head -5)
            if [ "${#cpp_files[@]}" -gt 0 ]; then
              # build/debug/compile_commands.json comes from the GCC build and
              # contains GCC-only warning flags (-Wduplicated-branches,
              # -Wduplicated-cond, -Wlogical-op, -Wuseless-cast). Tell clang to
              # treat unknown warning options as warnings, not as
              # clang-diagnostic-unknown-warning-option errors.
              clang-tidy -p build/debug \
                --extra-arg-before=-Wno-unknown-warning-option \
                "${cpp_files[@]}"
            else
              echo "::notice::no src/*.cpp files found to clang-tidy"
            fi
          fi

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Conan install (Release)
        uses: ./.github/actions/conan-install
        with:
          build-type: Release
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Run unit tests
        run: |
          cd build/release
          if ctest --output-on-failure -L unit 2>/dev/null; then
            echo "Unit tests (labelled) passed"
          else
            ctest --output-on-failure
          fi

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Conan install (Release)
        uses: ./.github/actions/conan-install
        with:
          build-type: Release
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Run integration tests
        run: |
          cd build/release
          if ctest --output-on-failure -L integration 2>/dev/null; then
            echo "Integration tests (labelled) passed"
          else
            ctest --output-on-failure
          fi

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: 0
      - name: Conan audit
        run: |
          pip install conan
          if pixi run conan-audit 2>/dev/null; then
            echo "Conan audit passed"
          else
            echo "::notice::pixi run conan-audit not available or no issues found"
          fi

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: |
          set -euo pipefail
          if [ -f .gitleaks.toml ]; then
            gitleaks detect --source . --config .gitleaks.toml \
              --report-format sarif --report-path gitleaks.sarif --exit-code 0
          else
            gitleaks detect --source . \
              --report-format sarif --report-path gitleaks.sarif --exit-code 0
          fi

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 90

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Conan install (Release)
        uses: ./.github/actions/conan-install
        with:
          build-type: Release
      - name: Configure with CMake
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow schemas
        # Use the network-free vendored schema. The previous schemastore.org
        # fetch was wrapped in an advisory `::warning::` to tolerate outages —
        # that masked real schema violations. The vendored schema bundled with
        # check-jsonschema has no network dependency and fails fast on
        # genuine schema errors. See docs/runbooks/no-silent-failures.md (Bucket F).
        run: |
          set -euo pipefail
          pip install check-jsonschema
          find .github/workflows -name "*.yml" | \
            xargs check-jsonschema --builtin-schema vendor.github-workflows

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check CMake version parseable
        run: |
          python3 -c "
          import re
          cmake = open('CMakeLists.txt').read()
          v = re.search(r'VERSION\s+(\S+)', cmake).group(1)
          print(f'CMake version: {v}')
          "

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265  # v20.0.0
        with:
          globs: "**/*.md"
          config: ".markdownlint.yaml"

  pixi-check:
    name: pixi-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Skip if no pixi.toml
        id: detect
        run: |
          if [ ! -f pixi.toml ]; then
            echo "::notice::No pixi.toml in repo, skipping pixi-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup pixi
        if: steps.detect.outputs.skip == 'false'
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.67.2
          cache: false
      - name: pixi install (locked)
        if: steps.detect.outputs.skip == 'false'
        # Require pixi.lock to be committed alongside pixi.toml. Running
        # `pixi install` unlocked was previously tolerated with an advisory
        # `::warning::`, which silently let dependency drift slip into CI.
        # See docs/runbooks/no-silent-failures.md (Bucket F).
        run: |
          if [ ! -f pixi.lock ]; then
            echo "::error::pixi.toml present but pixi.lock missing — commit pixi.lock alongside pixi.toml to pin dependencies."
            exit 1
          fi
          pixi install --locked

  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Skip if no justfile
        id: detect
        run: |
          if [ ! -f justfile ] && [ ! -f Justfile ]; then
            echo "::notice::No justfile in repo, skipping justfile-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install just
        if: steps.detect.outputs.skip == 'false'
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6  # v2.0.0
        with:
          just-version: "1.36.0"
      - name: Validate justfile
        if: steps.detect.outputs.skip == 'false'
        run: |
          just --evaluate >/dev/null
          just --list >/dev/null

  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run symlink check
        run: bash scripts/check-symlinks.sh

  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          no-fail: false

      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf  # v3.2.0
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db  # v3.6.1

      - name: Build image (single-arch, load locally)
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85  # v6.7.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: projectnestor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image metadata
        run: |
          set -euo pipefail
          # Dockerfile uses CMD ["ProjectNestor_server"] with no ENTRYPOINT.
          # Assert Cmd is non-empty; Entrypoint is allowed to be null.
          cmd=$(docker inspect --format '{{json .Config.Cmd}}' projectnestor:ci)
          if [ "$cmd" = "null" ] || [ "$cmd" = "[]" ]; then
            echo "Config.Cmd is empty: $cmd"
            exit 1
          fi

          user=$(docker inspect --format '{{.Config.User}}' projectnestor:ci)
          if [ "$user" != "nestor" ]; then
            echo "Expected USER nestor, got: '$user'"
            exit 1
          fi

          ports=$(docker inspect --format '{{json .Config.ExposedPorts}}' projectnestor:ci)
          if ! echo "$ports" | grep -q '"8081/tcp"'; then
            echo "8081/tcp not in ExposedPorts: $ports"
            exit 1
          fi

          hc=$(docker inspect --format '{{json .Config.Healthcheck.Test}}' projectnestor:ci)
          if [ "$hc" = "null" ] || [ "$hc" = "[]" ]; then
            echo "Healthcheck.Test is empty: $hc"
            exit 1
          fi

          echo "inspect OK: cmd=$cmd user=$user ports=$ports healthcheck=$hc"

      - name: Smoke run (detached + health poll)
        run: |
          set -euo pipefail

          cleanup() {
            # Deterministic: only act if the container still exists.
            # No `|| true` — every command's exit status is meaningful.
            if [ -n "${cid:-}" ] && [ -n "$(docker ps -aq --filter "id=$cid")" ]; then
              docker rm -f "$cid" >/dev/null
            fi
          }
          trap cleanup EXIT

          cid=$(docker run -d \
            -e NATS_URL=nats://invalid.local:4222 \
            -p 18081:8081 \
            projectnestor:ci)

          # Poll /v1/health for up to 30s. The route (routes.cpp:25) returns
          # {"status":"ok"} unconditionally, so a 2xx here proves the binary
          # started and registered routes — independent of NATS state.
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/v1/health >/dev/null; then
              ok=1
              echo "health OK on attempt $i"
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "health endpoint did not return 2xx within 30s; container logs:"
            docker logs "$cid"
            exit 1
          fi

          # Verify graceful-degradation log line (server_main.cpp:63).
          # Confirms the NATS-unreachable code path executes cleanly.
          logs=$(docker logs "$cid" 2>&1)
          if ! echo "$logs" | grep -q 'NATS unavailable'; then
            echo "expected 'NATS unavailable' log line not found; full logs:"
            echo "$logs"
            exit 1
          fi
          echo "smoke OK"
