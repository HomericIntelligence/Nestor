name: Required Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # merge_group is intentionally absent: the merge queue runs the fast
  # merge-queue-smoke.yml workflow instead (single merge-queue-smoke job,
  # <5 min). Re-running every job here per queue entry starved the runner pool
  # and pushed queue merges to 70-90 min.

concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: "Reject silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            -- \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.hcl' \
            'Dockerfile*' '**/Dockerfile*' \
            'justfile' '**/justfile' 'Justfile' '**/Justfile')
          declare -a scan_files=()
          for f in "${files[@]}"; do
            case "$f" in
              # Exempt this workflow file (heredoc would otherwise self-match)
              .github/workflows/_required.yml) continue ;;
              # Exempt any runbook that documents the rule (if present)
              docs/runbooks/no-silent-failures.md) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nE '\|\|[[:space:]]*true([[:space:]]*$|[[:space:]]+#)' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found silent-failure workarounds above. Refactor per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no silent-failure workarounds found'

      - name: "Reject continue-on-error workflow opt-out"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow files"
            exit 0
          fi
          if grep -nE '^[[:space:]]*continue-on-error:[[:space:]]*true[[:space:]]*$' "${files[@]}"; then
            echo ""
            echo '::error::Found "continue-on-error: true" above. Fix the root cause per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no "continue-on-error: true" found'

      - name: "Reject advisory annotation pattern"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          # The advisory-annotation pattern in workflow run blocks is morally
          # equivalent to continue-on-error: true: it lets a tool fail without
          # failing the CI step. The runbook (Bucket F) requires every tool
          # to be fail-fast. The only legitimate annotation is informational
          # text not tied to a tool's exit code — those should use
          # echo "WARN:" to stdout instead. See docs/runbooks/no-silent-failures.md.
          declare -a scan_files=()
          for f in "${files[@]}"; do
            # Exempt this workflow file (heredoc would otherwise self-match).
            case "$f" in
              .github/workflows/_required.yml) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nF '::warning::' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found advisory annotations above. Make the underlying tool fail-fast or use echo "WARN:" to stdout. See docs/runbooks/no-silent-failures.md Bucket F.'
            exit 1
          fi
          echo 'OK: no advisory annotations found'

  branch-protection-drift:
    name: branch-protection-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Verify branch protection configuration
        run: bash scripts/verify-branch-protection.sh

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-debug-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-debug-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      # Runs clang-format, yamllint, and the clang-tidy debug build inside the
      # CI container with the workspace + conan cache mounted.
      - name: Lint (in container)
        run: |
          mkdir -p "$HOME/.conan2"
          CONAN_HOME_HOST="$HOME/.conan2" bash scripts/run_ci_local.sh lint

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      - name: Build + run unit tests (in container)
        run: |
          mkdir -p "$HOME/.conan2"
          CONAN_HOME_HOST="$HOME/.conan2" bash scripts/run_ci_local.sh unit

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      - name: Build + run integration tests (in container)
        run: |
          mkdir -p "$HOME/.conan2"
          CONAN_HOME_HOST="$HOME/.conan2" bash scripts/run_ci_local.sh integration

  concurrency-tests:
    name: concurrency-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      - name: Build + run concurrency tests (in container)
        run: |
          mkdir -p "$HOME/.conan2"
          CONAN_HOME_HOST="$HOME/.conan2" bash scripts/run_ci_local.sh concurrency

  nats-integration-tests:
    name: nats-integration-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      # The live-broker harness (test/src/test_nats_client_live.cpp) shells out
      # to `docker compose` for the broker-bounce tests (compose_ctl), so this
      # job is the one exception to pure-podman execution: the broker stays a
      # docker compose sidecar (started on the runner, exactly as before) and
      # the docker CLI + socket are mounted into the CI container so the tests
      # can control it. The build/test toolchain itself runs in the container.
      - name: Start NATS broker (JetStream)
        run: docker compose -f test/docker/docker-compose.nats.yml up -d --wait

      - name: Run live-broker NATS tests (in container)
        env:
          NESTOR_LIVE_NATS_URL: nats://127.0.0.1:4222
          NESTOR_LIVE_NATS_COMPOSE: /workspace/test/docker/docker-compose.nats.yml
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.conan2"
          # Any container uid must be able to drive the docker CLI via the
          # mounted socket (the runner's docker group membership does not map
          # into the container user namespace).
          sudo chmod 0666 /var/run/docker.sock
          podman run --rm \
            --userns=keep-id:uid=1000,gid=1000 \
            -e CONAN_HOME=/tmp/conan2 \
            --network host \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e NESTOR_LIVE_NATS_URL \
            -e NESTOR_LIVE_NATS_COMPOSE \
            -w /workspace nestor-ci:local \
            bash -c '
              set -euo pipefail
              conan profile detect --exist-ok >/dev/null 2>&1
              conan install . --build=missing -s build_type=Release --output-folder build/release >/dev/null
              cmake --preset release
              cmake --build --preset release
              cd build/release
              ctest --output-on-failure -L live-nats --no-tests=error
            '

      - name: Stop NATS broker
        if: always()
        run: docker compose -f test/docker/docker-compose.nats.yml down -v

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [unit-tests, integration-tests, concurrency-tests, nats-integration-tests]
    if: always()
    steps:
      - name: Aggregate test results
        # Canonical `test` check for the Odysseus board. Re-emits the combined
        # status of the unit/integration/concurrency sub-checks (which are kept
        # as separate check-runs). No `|| true`: any non-success fails fast.
        run: |
          set -euo pipefail
          rc=0
          for r in \
            "unit-tests=${{ needs.unit-tests.result }}" \
            "integration-tests=${{ needs.integration-tests.result }}" \
            "concurrency-tests=${{ needs.concurrency-tests.result }}" \
            "nats-integration-tests=${{ needs.nats-integration-tests.result }}"; do
            name=${r%%=*}
            result=${r#*=}
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed (result: $result)"
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            exit 1
          fi
          echo "All test sub-checks passed"

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      # Trivy filesystem scan + conan audit, all inside the CI container.
      # Trivy is pinned in ci/Containerfile; conan comes from the locked uv
      # toolchain. The audit provider token is passed through when present.
      - name: Dependency + audit scans (in container)
        env:
          CONAN_AUDIT_PROVIDER_TOKEN: ${{ secrets.CONAN_AUDIT_PROVIDER_TOKEN }}
        run: |
          bash scripts/run_ci_local.sh security

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      # Gitleaks is pinned in ci/Containerfile (v8.30.1 — same version the
      # native job downloaded); enforcement is strict (--exit-code 1).
      - name: Run Gitleaks (in container)
        run: |
          bash scripts/run_ci_local.sh secrets

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 90

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore Conan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-
            conan-${{ runner.os }}-

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      - name: Configure + build (in container)
        run: |
          mkdir -p "$HOME/.conan2"
          CONAN_HOME_HOST="$HOME/.conan2" bash scripts/run_ci_local.sh build

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      # Use the network-free vendored schema. The previous schemastore.org
      # fetch was wrapped in an advisory `::warning::` to tolerate outages —
      # that masked real schema violations. The vendored schema bundled with
      # check-jsonschema has no network dependency and fails fast on
      # genuine schema errors. See docs/runbooks/no-silent-failures.md (Bucket F).
      - name: Validate workflow schemas
        run: |
          # check-jsonschema and yamllint are baked into the CI image
          # (ci/Containerfile); PyYAML==6.0.3 is installed in the uv venv as a
          # locked conan dependency — the merge-queue policy tests assert the
          # PyYAML==6.0.3 pin, and they must not float independently in CI.
          podman run --rm --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" -w /workspace nestor-ci:local \
            bash -c '
              set -euo pipefail
              find .github/workflows -name "*.yml" | \
                xargs check-jsonschema --builtin-schema vendor.github-workflows
            '
      - name: Test merge-queue readiness
        run: |
          podman run --rm --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" -w /workspace nestor-ci:local \
            python3 test/test_merge_queue.py

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      - name: Check CMake version parseable (in container)
        run: |
          bash scripts/run_ci_local.sh deps-version-sync

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265  # v20.0.0
        with:
          globs: "**/*.md"
          config: ".markdownlint.yaml"

  uv-check:
    name: uv-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      # Assert the committed uv.lock is in sync with pyproject.toml (ADR-018:
      # uv replaces pixi). `uv lock --check` fails if the lockfile would change,
      # i.e. it was not regenerated after a manifest edit.
      - name: Check build-toolchain lock (in container)
        run: |
          bash scripts/run_ci_local.sh uv-check

  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Skip if no justfile
        id: detect
        run: |
          if [ ! -f justfile ] && [ ! -f Justfile ]; then
            echo "::notice::No justfile in repo, skipping justfile-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install just
        if: steps.detect.outputs.skip == 'false'
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6  # v2.0.0
        with:
          just-version: "1.36.0"
      - name: Validate justfile
        if: steps.detect.outputs.skip == 'false'
        run: |
          just --evaluate >/dev/null
          just --list >/dev/null

  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run symlink check
        run: bash scripts/check-symlinks.sh

  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          no-fail: false

      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf  # v3.2.0
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db  # v3.6.1

      - name: Build image (single-arch, load locally)
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85  # v6.7.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: nestor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image metadata
        run: |
          set -euo pipefail
          # Dockerfile uses CMD ["Nestor_server"] with no ENTRYPOINT.
          # Assert Cmd is non-empty; Entrypoint is allowed to be null.
          cmd=$(docker inspect --format '{{json .Config.Cmd}}' nestor:ci)
          if [ "$cmd" = "null" ] || [ "$cmd" = "[]" ]; then
            echo "Config.Cmd is empty: $cmd"
            exit 1
          fi

          user=$(docker inspect --format '{{.Config.User}}' nestor:ci)
          if [ "$user" != "nestor" ]; then
            echo "Expected USER nestor, got: '$user'"
            exit 1
          fi

          ports=$(docker inspect --format '{{json .Config.ExposedPorts}}' nestor:ci)
          if ! echo "$ports" | grep -q '"8081/tcp"'; then
            echo "8081/tcp not in ExposedPorts: $ports"
            exit 1
          fi

          hc=$(docker inspect --format '{{json .Config.Healthcheck.Test}}' nestor:ci)
          if [ "$hc" = "null" ] || [ "$hc" = "[]" ]; then
            echo "Healthcheck.Test is empty: $hc"
            exit 1
          fi

          echo "inspect OK: cmd=$cmd user=$user ports=$ports healthcheck=$hc"

      - name: Smoke run (detached + health poll)
        run: |
          set -euo pipefail

          cleanup() {
            # Deterministic: only act if the container still exists.
            # No `|| true` — every command's exit status is meaningful.
            if [ -n "${cid:-}" ] && [ -n "$(docker ps -aq --filter "id=$cid")" ]; then
              docker rm -f "$cid" >/dev/null
            fi
          }
          trap cleanup EXIT

          # NESTOR_AUTH_TOKEN: the server is fail-secure (auth mode defaults
          # to 'required') and exits at startup without a token; a throwaway
          # value keeps the smoke test about routes, not auth.
          # NESTOR_BIND_ADDR: the loopback-only default cannot be reached
          # through the published port from the runner.
          cid=$(docker run -d \
            -e NATS_URL=nats://invalid.local:4222 \
            -e NESTOR_AUTH_TOKEN=ci-smoke-only-token \
            -e NESTOR_BIND_ADDR=0.0.0.0 \
            -p 18081:8081 \
            nestor:ci)

          # Poll /v1/health for up to 30s. The route (routes.cpp:25) returns
          # {"status":"ok"} unconditionally, so a 2xx here proves the binary
          # started and registered routes — independent of NATS state.
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ci-smoke-only-token" http://127.0.0.1:18081/v1/health >/dev/null; then
              ok=1
              echo "health OK on attempt $i"
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "health endpoint did not return 2xx within 30s; container logs:"
            docker logs "$cid"
            exit 1
          fi

          # Verify graceful-degradation log line (server_main.cpp:145,
          # nats_client.cpp:123). Confirms the NATS-unreachable code path
          # executes cleanly. Pattern must match the exact literal emitted by
          # NatsClient::connect() / main(): "NATS unreachable at startup —
          # retrying in background." (the code never logs "NATS unavailable").
          #
          # The line is emitted asynchronously relative to /v1/health becoming
          # ready (and container stdout may be block-buffered), so a one-shot
          # grep right after the health poll races the log flush. Poll for it
          # with the same 30x1s budget as the health check.
          log_ok=0
          for i in $(seq 1 30); do
            logs=$(docker logs "$cid" 2>&1)
            if echo "$logs" | grep -q 'NATS unreachable'; then
              log_ok=1
              echo "'NATS unreachable' log line found on attempt $i"
              break
            fi
            sleep 1
          done

          if [ "$log_ok" -ne 1 ]; then
            echo "expected 'NATS unreachable' log line not found within 30s; full logs:"
            echo "$logs"
            exit 1
          fi
          echo "smoke OK"
