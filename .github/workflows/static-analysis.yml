name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build clang-format container
        run: podman build -t nestor-clang-format -f Dockerfile.clang-format .
      - name: Check formatting
        run: ./scripts/format.sh --check

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-nestor-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-nestor-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t nestor-ci:local .

      # Debug build with clang-tidy enabled, inside the CI container
      # (clang-tidy comes from apt in the image, not the uv toolchain —
      # ADR-018: no maintained self-contained PyPI wheel).
      - name: Configure + build with clang-tidy (in container)
        run: |
          mkdir -p "$HOME/.conan2"
          podman run --rm \
            --userns=keep-id:uid=1000,gid=1000 \
            -e CONAN_HOME=/tmp/conan2 \
            -v "$PWD:/workspace:Z" \
            -v "$HOME/.conan2:/home/ci/.conan2:Z" \
            -w /workspace nestor-ci:local \
            bash -c '
              set -euo pipefail
              conan profile detect --exist-ok >/dev/null 2>&1
              conan install . --build=missing -s build_type=Debug --output-folder build/debug >/dev/null
              cmake --preset debug -DNestor_ENABLE_CLANG_TIDY=ON
              cmake --build --preset debug
            '

  check-all:
    name: All Static Analysis Checks
    runs-on: ubuntu-24.04
    needs: [clang-format, clang-tidy]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.clang-format.result }}" != "success" ] || \
             [ "${{ needs.clang-tidy.result }}" != "success" ]; then
            echo "Static analysis failed"; exit 1
          fi
          echo "All checks passed"
