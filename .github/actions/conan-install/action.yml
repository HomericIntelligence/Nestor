name: Conan Install
description: >
  Installs Conan, detects the default profile, and runs conan install for
  the requested build type. Deduplicates the conan setup sequence that was
  previously copy-pasted across multiple CI workflows.

inputs:
  build-type:
    description: 'Conan build type (Debug or Release)'
    required: true
    default: Release
  output-subdir:
    description: 'Output subdirectory under build/ (if not specified, derives from lowercased build-type)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Conan
      shell: bash
      run: pip install conan

    - name: Detect Conan profile
      shell: bash
      run: conan profile detect --force

    - name: Install Conan dependencies
      shell: bash
      run: |
        output_dir="build/${{ inputs.output-subdir }}"
        if [ -z "${{ inputs.output-subdir }}" ]; then
          output_dir="build/$(echo '${{ inputs.build-type }}' | tr '[:upper:]' '[:lower:]')"
        fi
        conan install . --build=missing \
          -s build_type="${{ inputs.build-type }}" \
          --output-folder "$output_dir"
